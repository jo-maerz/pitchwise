expose_php = Off
display_errors = Off
log_errors = On
; Laravel never uses PHP's own upload progress tracking; the October 2026 PHP security advisory suggests turning it off.
session.upload_progress.enabled = Off
memory_limit = 256M
upload_max_filesize = 20M
post_max_size = 25M
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.max_accelerated_files = 20000
